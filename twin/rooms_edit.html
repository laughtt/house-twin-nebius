<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twin Room Editor</title>
<style>
/* Layout: the plan fills the left, the room list on the right; tools across the top, export at the bottom of the list. */
:root {
  --paper: #F3F5F2; --sheet: #FFFFFF; --ink: #17201B; --muted: #5A665F; --line: #D3DAD4; --wall: #1E2622;
  --accent: #0A6B5C; --accent-soft: #DCEFEA; --warn: #9A6412; --warn-soft: #F8EED9; --obj: #C8CEC9; --lm: #B4462B;
  --f-body: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #0F1412; --sheet: #161D1A; --ink: #E4EAE6; --muted: #9AA7A0; --line: #2C3632; --wall: #E4EAE6;
  --accent: #46C2A8; --accent-soft: #143A32; --warn: #E2AE52; --warn-soft: #3A2C12; --obj: #3A4540; --lm: #F08A6C; color-scheme: dark } }
* { box-sizing: border-box }
html, body { height: 100% }
body { margin: 0; background: var(--paper); color: var(--ink); font: 400 14px/1.45 var(--f-body); display: grid; grid-template-rows: auto 1fr }
header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--sheet) }
h1 { font-size: 1.15rem; margin: 0; font-weight: 700; letter-spacing: -.01em }
.house { font: 600 .78rem var(--f-mono); color: var(--muted) }
.tools { display: flex; flex-wrap: wrap; gap: 6px }
button { font: 600 .85rem var(--f-body); border: 1.5px solid var(--line); background: var(--sheet); color: var(--ink); padding: 6px 11px; border-radius: 7px; cursor: pointer }
button:hover { border-color: var(--muted) }
button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink) }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
button.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent) }
kbd { font: .72rem var(--f-mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; color: var(--muted); margin-left: 4px }
.hint { color: var(--muted); font-size: .85rem; flex: 1 1 260px }
main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0 }
#map { width: 100%; height: 100%; min-height: 420px; display: block; touch-action: none; user-select: none; cursor: crosshair }
#map.select { cursor: pointer }
aside { border-left: 1px solid var(--line); background: var(--sheet); display: grid; grid-template-rows: auto 1fr auto; min-height: 0 }
.stats { padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: .85rem; color: var(--muted); display: grid; gap: 4px }
.stats b { color: var(--ink); font-variant-numeric: tabular-nums }
.warn { color: var(--warn) }
#list { overflow: auto; padding: 8px; display: grid; gap: 6px; align-content: start }
.room { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 8px; align-items: center; padding: 8px 9px; border: 1.5px solid var(--line); border-radius: 8px; cursor: pointer }
.room.sel { border-color: var(--accent); background: var(--accent-soft) }
.room.empty { opacity: .55 }
.sw { width: 14px; height: 14px; border-radius: 3px }
.room input { font: 600 .92rem var(--f-body); color: var(--ink); background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 2px 5px; min-width: 0; width: 100% }
.room input:hover, .room input:focus { border-color: var(--line); background: var(--sheet) }
.del { padding: 2px 8px; font-size: .8rem }
.meta { grid-column: 2 / 4; font: .74rem var(--f-mono); color: var(--muted) }
.things { grid-column: 2 / 4; font-size: .78rem; color: var(--muted) }
.export { padding: 12px 14px; border-top: 1px solid var(--line); display: grid; gap: 8px }
.export .row { display: flex; gap: 6px; flex-wrap: wrap }
.export code { font: .72rem/1.4 var(--f-mono); background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 6px 7px; overflow-wrap: anywhere; display: block }
.toast { font-size: .8rem; color: var(--accent); min-height: 1.1em }
svg text { font-family: var(--f-body); pointer-events: none }
@media (max-width: 820px) {
  body { grid-template-rows: auto auto auto }
  main { grid-template-columns: 1fr }
  aside { border-left: 0; border-top: 1px solid var(--line) }
  #map { height: 60vh }
}
</style>
</head>
<body>
<header>
  <div><h1>Twin Room Editor</h1><span class="house" id="house"></span></div>
  <div class="tools" role="toolbar" aria-label="Tools">
    <button id="t-select" data-mode="select">Select<kbd>V</kbd></button>
    <button id="t-new" data-mode="new">New room<kbd>N</kbd></button>
    <button id="t-add" data-mode="add">Add to room<kbd>A</kbd></button>
    <button id="t-erase" data-mode="erase">Erase<kbd>E</kbd></button>
    <button id="t-undo">Undo<kbd>⌘Z</kbd></button>
    <button id="t-reset">Back to scan</button>
  </div>
  <span class="hint" id="hint"></span>
</header>
<main>
  <svg id="map" aria-label="Floor plan"></svg>
  <aside>
    <div class="stats" id="stats"></div>
    <div id="list"></div>
    <div class="export">
      <div class="row"><button class="primary" id="dl">Download rooms.json</button><button id="copy">Copy JSON</button></div>
      <code id="cmd"></code>
      <span class="toast" id="toast" role="status"></span>
    </div>
  </aside>
</main>
<script>
const D = /*DATA*/null;
const KEY = "rooms-edit:" + D.house, SNAP = 0.05, M = 0.4;
const PAL = ["#E07A5F", "#3D85C6", "#81B29A", "#E2B33C", "#9B5DE5", "#00A6A6", "#F15BB5", "#8D99AE", "#6A994E", "#5FA8D3", "#B5838D", "#D9822B"];
const HINT = {
  select: "Click a room to select it. Rename it in the list: the robot will use that name.",
  new: "Drag a rectangle: a new room. It takes that floor from the rooms under it.",
  add: "Drag a rectangle to add floor to the selected room (taken from the others).",
  erase: "Drag a rectangle to take floor out of every room (a corridor nobody names, a wall gap).",
};
const clone = x => JSON.parse(JSON.stringify(x));
const area = r => (r[2] - r[0]) * (r[3] - r[1]);
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "room";
const snap = v => Math.round(v / SNAP) * SNAP;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let rooms, sel = null, mode = "select", undo = [], drag = null;
try { rooms = JSON.parse(localStorage.getItem(KEY)) } catch (e) { rooms = null }
if (!Array.isArray(rooms)) rooms = clone(D.rooms);
rooms.forEach((r, i) => r.color = r.color || PAL[i % PAL.length]);
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(rooms)) } catch (e) {} };
const ORIG = D.rooms.reduce((a, r) => a + r.rects.reduce((b, q) => b + area(q), 0), 0);

// the plan's frame: metres, y up in the house, y down on screen
const xs = D.walls.flatMap(w => [w[0][0], w[1][0]]), ys = D.walls.flatMap(w => [w[0][1], w[1][1]]);
const X0 = Math.min(...xs), X1 = Math.max(...xs), Y0 = Math.min(...ys), Y1 = Math.max(...ys);
const sx = x => x - X0 + M, sy = y => Y1 - y + M;
const svg = document.getElementById("map");
svg.setAttribute("viewBox", `0 0 ${X1 - X0 + 2 * M} ${Y1 - Y0 + 2 * M}`);
document.getElementById("house").textContent = D.house;

function sub(a, b) {  // rectangle a minus rectangle b → up to four rectangles
  const x0 = Math.max(a[0], b[0]), y0 = Math.max(a[1], b[1]), x1 = Math.min(a[2], b[2]), y1 = Math.min(a[3], b[3]);
  if (x0 >= x1 || y0 >= y1) return [a];
  return [[a[0], a[1], a[2], y0], [a[0], y1, a[2], a[3]], [a[0], y0, x0, y1], [x1, y0, a[2], y1]].filter(r => area(r) > 1e-4);
}
const cut = (r, keep) => rooms.forEach(rm => { if (rm !== keep) rm.rects = rm.rects.flatMap(q => sub(q, r)) });
const inside = (q, x, y) => q[0] <= x && x <= q[2] && q[1] <= y && y <= q[3];
const gap = (q, x, y) => Math.max(q[0] - x, 0, x - q[2]) + Math.max(q[1] - y, 0, y - q[3]);
function roomAt(x, y) { for (let i = rooms.length - 1; i >= 0; i--) if (rooms[i].rects.some(q => inside(q, x, y))) return rooms[i]; return null }
function nearest(x, y) {  // like agent/language.py home(): the room a thing belongs to
  let best = null, bd = Infinity;
  for (const r of rooms) for (const q of r.rects) { const d = gap(q, x, y); if (d < bd) { bd = d; best = r } }
  return best;
}
const roomArea = r => r.rects.reduce((a, q) => a + area(q), 0);
function uniqueName(label, me) {
  const base = slug(label); let n = base, k = 2;
  while (rooms.some(r => r !== me && r.name === n)) n = `${base}_${k++}`;
  return n;
}
function push() { undo.push(JSON.stringify({ rooms, sel: sel && rooms.indexOf(sel) })); if (undo.length > 80) undo.shift() }
function pop() {
  const s = undo.pop(); if (!s) return;
  const st = JSON.parse(s); rooms = st.rooms; sel = st.sel != null && st.sel >= 0 ? rooms[st.sel] : null;
  save(); render(); list();
}

function render() {
  const things = {};
  for (const t of [...D.objects, ...D.landmarks]) { const r = nearest(...t.c); if (r) (things[r.name] = things[r.name] || new Set()).add(t.label) }
  rooms.forEach(r => r.things = [...(things[r.name] || [])].sort());
  let h = "";
  for (const r of rooms) {
    const on = r === sel;
    for (const q of r.rects)
      h += `<rect x="${sx(q[0])}" y="${sy(q[3])}" width="${q[2] - q[0]}" height="${q[3] - q[1]}" fill="${r.color}" fill-opacity="${on ? .55 : .3}" stroke="${r.color}" stroke-width="${on ? .05 : .015}"/>`;
  }
  for (const o of D.objects) {
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw), w = o.s[0] / 2, d = o.s[1] / 2;
    const pts = [[-w, -d], [w, -d], [w, d], [-w, d]].map(([a, b]) => `${sx(o.c[0] + a * c - b * s)},${sy(o.c[1] + a * s + b * c)}`).join(" ");
    h += `<polygon points="${pts}" fill="var(--obj)" opacity=".8"><title>${esc(o.label)}</title></polygon>`;
  }
  for (const w of D.walls) h += `<line x1="${sx(w[0][0])}" y1="${sy(w[0][1])}" x2="${sx(w[1][0])}" y2="${sy(w[1][1])}" stroke="var(--wall)" stroke-width=".09" stroke-linecap="square"/>`;
  for (const d of D.doors) h += `<circle cx="${sx(d.c[0])}" cy="${sy(d.c[1])}" r="${d.w / 2}" fill="none" stroke="var(--accent)" stroke-width=".04" stroke-dasharray=".08 .06"><title>door</title></circle>`;
  for (const l of D.landmarks) h += `<circle cx="${sx(l.c[0])}" cy="${sy(l.c[1])}" r=".07" fill="var(--lm)"/><text x="${sx(l.c[0]) + .1}" y="${sy(l.c[1]) + .07}" font-size=".2" fill="var(--lm)">${esc(l.label)}</text>`;
  for (const r of rooms) {
    if (!r.rects.length) continue;
    const q = r.rects.reduce((a, b) => area(b) > area(a) ? b : a);
    const fs = Math.max(.2, Math.min(.42, Math.sqrt(area(q)) / 6));
    h += `<text x="${sx((q[0] + q[2]) / 2)}" y="${sy((q[1] + q[3]) / 2)}" font-size="${fs}" font-weight="700" text-anchor="middle" fill="var(--ink)">${esc(r.label)}</text>`;
    h += `<text x="${sx((q[0] + q[2]) / 2)}" y="${sy((q[1] + q[3]) / 2) + fs}" font-size="${fs * .65}" text-anchor="middle" fill="var(--muted)">${roomArea(r).toFixed(1)} m²</text>`;
  }
  if (drag && drag.b) {
    const q = box(drag.a, drag.b);
    const col = mode === "erase" ? "var(--warn)" : mode === "add" && sel ? sel.color : "var(--accent)";
    h += `<rect x="${sx(q[0])}" y="${sy(q[3])}" width="${q[2] - q[0]}" height="${q[3] - q[1]}" fill="${col}" fill-opacity=".25" stroke="${col}" stroke-width=".04" stroke-dasharray=".12 .08"/>`;
    h += `<text x="${sx(q[2]) + .08}" y="${sy(q[1])}" font-size=".22" fill="var(--ink)">${(q[2] - q[0]).toFixed(2)} × ${(q[3] - q[1]).toFixed(2)} m</text>`;
  }
  svg.innerHTML = h;
  const total = rooms.reduce((a, r) => a + roomArea(r), 0), lost = ORIG - total;
  document.getElementById("stats").innerHTML =
    `<span><b>${rooms.filter(r => r.rects.length).length}</b> rooms · <b>${total.toFixed(1)}</b> m² named</span>` +
    (lost > 0.05 ? `<span class="warn">${lost.toFixed(1)} m² of the scan's floor is in no room</span>` : `<span>every bit of the scan's floor is in a room</span>`) +
    `<span>Snaps to ${SNAP * 100} cm. Walls and doors stay as scanned.</span>`;
  document.getElementById("cmd").textContent = `python -m twin.rooms_edit out/houses/${D.house} --apply ~/Downloads/rooms.json`;
  rooms.forEach((r, i) => { const m = document.getElementById("meta-" + i), t = document.getElementById("things-" + i);
    if (m) m.textContent = `${r.name} · ${roomArea(r).toFixed(1)} m²${r.rects.length ? "" : " · empty, won't be saved"}`;
    if (t) t.textContent = r.things.length ? r.things.join(", ") : "nothing found here" });
}

function list() {
  const el = document.getElementById("list");
  el.innerHTML = rooms.map((r, i) => `
    <div class="room${r === sel ? " sel" : ""}${r.rects.length ? "" : " empty"}" data-i="${i}">
      <span class="sw" style="background:${r.color}"></span>
      <input id="label-${i}" value="${esc(r.label)}" aria-label="Room name" maxlength="40">
      <button class="del" data-del="${i}" aria-label="Delete ${esc(r.label)}">Delete</button>
      <span class="meta" id="meta-${i}"></span>
      <span class="things" id="things-${i}"></span>
    </div>`).join("");
  render();
}
document.getElementById("list").addEventListener("click", e => {
  const d = e.target.closest("[data-del]");
  if (d) { push(); const r = rooms[+d.dataset.del]; rooms.splice(+d.dataset.del, 1); if (sel === r) sel = null; save(); list(); return }
  const row = e.target.closest(".room"); if (row) { sel = rooms[+row.dataset.i]; [...document.querySelectorAll(".room")].forEach(x => x.classList.toggle("sel", x === row)); render() }
});
document.getElementById("list").addEventListener("focusin", e => { if (e.target.matches("input")) push() });
document.getElementById("list").addEventListener("input", e => {
  if (!e.target.matches("input")) return;
  const r = rooms[+e.target.closest(".room").dataset.i];
  r.label = e.target.value; r.name = uniqueName(e.target.value, r); save(); render();
});

function box(a, b) { return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[0], b[0]), Math.max(a[1], b[1])] }
function at(e) {
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  const q = p.matrixTransform(svg.getScreenCTM().inverse());
  return [snap(q.x + X0 - M), snap(Y1 - (q.y - M))];
}
svg.addEventListener("pointerdown", e => {
  const p = at(e);
  if (mode === "select") { sel = roomAt(...p); list(); return }
  if (mode === "add" && !sel) { toast("Select a room first (in the list or with Select)."); return }
  drag = { a: p, b: null }; svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => { if (drag) { drag.b = at(e); render() } });
svg.addEventListener("pointerup", () => {
  if (!drag || !drag.b) { drag = null; return }
  const q = box(drag.a, drag.b); drag = null;
  if (area(q) < 0.04) { render(); return }
  push();
  if (mode === "new") {
    const r = { name: "", label: `Room ${rooms.length + 1}`, rects: [q], color: PAL[rooms.length % PAL.length] };
    r.name = uniqueName(r.label, r); cut(q, r); rooms.push(r); sel = r;
  } else if (mode === "add") { cut(q, sel); sel.rects = sel.rects.flatMap(x => sub(x, q)).concat([q]) }
  else if (mode === "erase") cut(q, null);
  save(); list();
  if (mode === "new") { const i = rooms.indexOf(sel), inp = document.getElementById("label-" + i); inp.focus(); inp.select() }
});

function setMode(m) {
  mode = m; svg.classList.toggle("select", m === "select");
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === m));
  document.getElementById("hint").textContent = HINT[m];
}
document.querySelectorAll("[data-mode]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.mode)));
document.getElementById("t-undo").addEventListener("click", pop);
document.getElementById("t-reset").addEventListener("click", () => { push(); rooms = clone(D.rooms); rooms.forEach((r, i) => r.color = PAL[i % PAL.length]); sel = null; save(); list(); toast("Back to the scan's rooms (Undo brings yours back).") });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z") { e.preventDefault(); pop(); return }
  if (e.target.matches("input")) return;
  const m = { v: "select", n: "new", a: "add", e: "erase" }[e.key.toLowerCase()]; if (m) setMode(m);
});

const out = () => JSON.stringify({ house: D.house, rooms: rooms.filter(r => r.rects.length).map(r => ({ name: r.name, label: r.label, rects: r.rects.map(q => q.map(v => +v.toFixed(3))) })) }, null, 1);
function toast(s) { const t = document.getElementById("toast"); t.textContent = s; clearTimeout(toast.h); toast.h = setTimeout(() => t.textContent = "", 4000) }
document.getElementById("dl").addEventListener("click", () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([out()], { type: "application/json" })); a.download = "rooms.json";
  document.body.appendChild(a); a.click(); a.remove(); toast("Saved rooms.json to your downloads. Run the command above.");
});
document.getElementById("copy").addEventListener("click", () => {
  navigator.clipboard.writeText(out()).then(() => toast("Copied."), () => toast("Copy blocked: use Download instead."));
});
setMode("select"); list();
</script>
</body>
</html>
