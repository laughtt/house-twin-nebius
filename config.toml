# House Twin Patrol settings. Paths may start with ~.

[paths]
out = "out"                                      # relative to house-twin-patrol/
pollen_rl = "~/Pollen/microduck_rl"              # Pollen's simulator + robot model (duck-sim's DUCK_SIM_RL)

[house]
wall_h = 2.5          # simulation wall height when the scan does not give a ceiling
open_plan_overlap = 0.3   # zones whose rectangles overlap this much (of the smaller) share one space, no wall between

# The object detector speaks COCO. In a home some of its words need the room to make sense:
# "rename" always applies; "only_in" keeps a label only in zones whose name contains one of the words, else uses "else"
# (empty = drop it).
[names.rename]
couch = "sofa"
refrigerator = "fridge"
sink = "counter"
oven = "counter"

[names.only_in]
toilet = { zones = ["bath", "toilet", "wc"], else = "" }
bed = { zones = ["bed"], else = "sofa" }
bench = { zones = ["hall", "entry", "garden"], else = "" }

[markers]
# printed sizes by id (metres): see capture/make_markers.py
sizes = [{ ids = [0, 9], m = 0.15 }, { ids = [10, 29], m = 0.10 }, { ids = [30, 39], m = 0.20 }, { ids = [40, 40], m = 0.15 }]

[landmarks]
low_h = 0.75       # a frame is "duck height" when the camera is lower than this (m): knee height or below
min_views = 3      # without the curate model: detector landmarks seen in fewer keyframes are dropped (tags always kept)
# how much the duck trusts a sighting, by how often that kind of thing moves ("ignore" = not a landmark)
weight = { fixed = 1.0, rare = 0.6, often = 0.2 }
# the home vocabulary: every label the checkers may give, grouped by how often it moves (anything else counts as "rare")
fixed = ["fridge", "oven", "stove", "sink", "kitchen counter", "counter", "toilet", "bathtub", "shower", "washer", "dishwasher",
         "wardrobe", "fireplace", "radiator", "door", "window"]
rare = ["sofa", "bed", "tv", "dining table", "desk", "bookshelf", "shelf", "cabinet", "dresser", "armchair", "piano", "microwave"]
often = ["chair", "office chair", "stool", "potted plant", "plant", "lamp", "bin", "bench", "fan", "vase", "basket", "suitcase",
         "backpack", "handbag", "umbrella", "bicycle"]
ignore = ["person", "dog", "cat", "cup", "bottle", "wine glass", "bowl", "cell phone", "book", "remote", "teddy bear", "picture",
          "poster", "mirror", "clothes", "curtain", "not a landmark"]
# the detector class a tag label answers to (tags with no class still go in house.json, for goals like "go to the sofa")
tag_cls = { fridge = "refrigerator", oven = "oven", stove = "oven", sink = "sink", sofa = "couch", bed = "bed", tv = "tv", table = "dining table", toilet = "toilet", plant = "potted plant" }

[nebius]
# Where model calls go (OpenAI-compatible). The submission needs "nebius" (Token Factory). "nvidia" = NVIDIA's API catalog,
# same Nemotron models, for development only (no Nebius account yet). Every call logs its provider in out/model_calls.jsonl.
provider = "nvidia"
image_px = 512                                   # long side of every image sent (fewer image tokens)

[nebius.nebius]
# IDs from a third-party listing: confirm with `python -m agent.nebius` (GET /v1/models)
base_url = "https://api.tokenfactory.nebius.com/v1"
key = "NEBIUS_API_KEY"
vl = "nvidia/Nemotron-3.5-Super-VL"              # camera frames: which room, landmark check, room measure
ultra = "nvidia/Nemotron-3-Ultra-550b-a55b"      # a spoken command → goals over house.json
lightning = "nvidia/Nemotron-3_5-Lightning"      # questions to the person, the patrol report
omni = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"  # speech → words (agent/voice.py)

[nebius.nvidia]
base_url = "https://integrate.api.nvidia.com/v1"
key = "NVIDIA_API_KEY"
vl = "nvidia/nemotron-3.5-super-vl-120b-a12b"
ultra = "nvidia/nemotron-3-ultra-550b-a55b"
lightning = "nvidia/nemotron-3.5-lightning-30b-a3b"
omni = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"

[nebius.price]
# $ per 1M tokens [in, out], Token Factory list prices (NVIDIA-catalog calls are costed as if on Token Factory)
"nvidia/Nemotron-3.5-Super-VL" = [0.30, 0.90]
"nvidia/Nemotron-3-Ultra-550b-a55b" = [1.0, 3.0]
"nvidia/nemotron-3-super-120b-a12b" = [0.30, 0.90]
"nvidia/Nemotron-3_5-Lightning" = [0.06, 0.24]
"nvidia/nemotron-3.5-super-vl-120b-a12b" = [0.30, 0.90]
"nvidia/nemotron-3-ultra-550b-a55b" = [1.0, 3.0]
"nvidia/nemotron-3.5-lightning-30b-a3b" = [0.06, 0.24]
"nvidia/nemotron-3-nano-omni-30b-a3b-reasoning" = [0.06, 0.24]  # not listed yet: costed as Lightning

[curate]
# who checks the landmark list (what each candidate really is, keep or drop, how often it moves):
#   rules  = the lists above only        opencv = ImageNet classifier on each crop (cv.dnn, offline)
#   clip   = open-vocabulary CLIP (cv.dnn, offline)   nemotron = Nemotron VL on Token Factory (NEBIUS_API_KEY)
#   hybrid = clip, and Nemotron only for the crops clip is unsure about (clip alone when there is no key)
#   opt-in, off the default path: gemini = Gemini API (GEMINI_API_KEY), haiku = Claude Haiku (Bedrock)
backend = "hybrid"
model = "global.anthropic.claude-haiku-5-5"   # haiku backend
region = "us-east-1"
gemini_model = "gemini-flash-latest"
max_images = 24
sure = 0.5            # a local classifier at least this confident decides alone (hybrid asks Gemini below it)
# CLIP also scores these, so it can say a crop shows no real object
clip_negatives = { "a blurry photo" = "not a landmark", "a reflection in a glass window" = "not a landmark", "a poster or picture on a wall" = "picture", "an empty wall" = "not a landmark", "the floor" = "not a landmark", "a person" = "person" }
